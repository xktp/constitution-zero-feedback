name: '[ko] 내용 또는 인용 수정'
description: 연구 본문, 출처 또는 인용의 수정을 제안해 주세요.
title: '[Correction][ko] '
body:
  - type: markdown
    attributes:
      value: |-
        Issue와 첨부 파일은 공개됩니다. 비밀번호, 토큰, 개인정보 또는 기밀 자료를 포함하지 마세요. 보안 취약점과 비공개 의견은 이메일로 보내 주세요.

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [모든 언어](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: 공개 페이지 또는 문서와 버전
      description: 공개 URL이나 문서 제목, 절, 알고 있는 버전을 적어 주세요. 비공개 식별 정보와 쿼리 매개변수는 제거해 주세요.
    validations:
      required: false
  - type: textarea
    id: excerpt
    attributes:
      label: 수정이 필요한 본문 또는 인용
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 수정 제안과 이유
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 공개 출처 또는 추가 설명 (선택)
    validations:
      required: false
