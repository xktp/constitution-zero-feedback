name: '[en] Bug report'
description: Report a problem and how to reproduce it.
title: '[Bug][en] '
body:
  - type: markdown
    attributes:
      value: |-
        Issues and attachments are public. Do not include passwords, tokens, personal information or confidential data. Send security vulnerabilities and private feedback by email instead.

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [All languages](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: Public page or document and version
      description: Include a public URL or document title, section and version if known. Remove private
        identifiers and query parameters.
    validations:
      required: false
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe what you did. If you cannot reproduce the problem, say so.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser, device and relevant settings (optional)
      description: For example browser/version, text size, keyboard or assistive technology if relevant.
        Do not share medical or personal details.
    validations:
      required: false
