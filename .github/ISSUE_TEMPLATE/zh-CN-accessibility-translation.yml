name: '[zh-CN] 无障碍或翻译反馈'
description: 报告使用障碍或翻译问题。
title: '[Accessibility/Translation][zh-CN] '
body:
  - type: markdown
    attributes:
      value: |-
        Issue 和附件会公开显示。请勿填写密码、令牌、个人信息或保密资料。安全漏洞和私密反馈请改用邮箱。

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [全部语言](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: 公开页面或文档及版本
      description: 请提供公开链接，或文档名称、章节及已知版本。移除私密标识和查询参数。
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: 反馈类型
      options:
        - 无障碍
        - 翻译
        - 两者都有
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: 使用障碍或翻译问题
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的表述或无障碍操作效果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 浏览器、设备及相关设置（选填）
      description: 例如浏览器版本、字号、键盘或相关辅助技术。无需提供医疗或个人资料。
    validations:
      required: false
