name: '[de] Inhalt oder Quellenangabe korrigieren'
description: Korrigiere Forschungstexte, Quellen oder Zitate.
title: '[Correction][de] '
body:
  - type: markdown
    attributes:
      value: |-
        Issues und Anhänge sind öffentlich. Veröffentliche keine Passwörter, Tokens, personenbezogenen oder vertraulichen Daten. Melde Sicherheitslücken und vertrauliche Anliegen per E-Mail.

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [Alle Sprachen](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: Öffentliche Seite oder Dokument und Version
      description: Nenne eine öffentliche URL oder Titel, Abschnitt und bekannte Version des Dokuments.
        Entferne private Kennungen und Abfrageparameter.
    validations:
      required: false
  - type: textarea
    id: excerpt
    attributes:
      label: Zu korrigierender Text oder Quellenverweis
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Korrekturvorschlag und Begründung
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Öffentliche Quellen oder ergänzende Erklärung (optional)
    validations:
      required: false
