name: '[ar] اقتراح ميزة'
description: اشرح الحاجة واقترح تحسينًا.
title: '[Feature][ar] '
body:
  - type: markdown
    attributes:
      value: |-
        البلاغات والمرفقات علنية. لا تنشر كلمات المرور أو رموز الوصول أو البيانات الشخصية أو السرية. أرسل الثغرات الأمنية والملاحظات الخاصة عبر البريد الإلكتروني.

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [جميع اللغات](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: الصفحة العامة أو الوثيقة وإصدارها
      description: أدرج رابطًا عامًا أو عنوان الوثيقة وقسمها وإصدارها إن عُرف. احذف المعرّفات الخاصة ومعلمات
        الاستعلام.
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: ما الحاجة التي يعالجها الاقتراح؟
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: التحسين المقترح
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: من سيستفيد وكيف؟ (اختياري)
    validations:
      required: false
