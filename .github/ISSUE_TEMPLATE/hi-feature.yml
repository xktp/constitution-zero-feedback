name: '[hi] सुविधा का सुझाव'
description: ज़रूरत समझाएँ और सुधार सुझाएँ।
title: '[Feature][hi] '
body:
  - type: markdown
    attributes:
      value: |-
        Issue और संलग्न फ़ाइलें सार्वजनिक होती हैं। पासवर्ड, टोकन, व्यक्तिगत या गोपनीय जानकारी शामिल न करें। सुरक्षा संबंधी कमज़ोरियाँ और निजी प्रतिक्रिया ईमेल से भेजें।

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [सभी भाषाएँ](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: सार्वजनिक पृष्ठ या दस्तावेज़ और संस्करण
      description: सार्वजनिक URL या दस्तावेज़ का नाम, अनुभाग और ज्ञात संस्करण दें। निजी पहचान संबंधी जानकारी
        और क्वेरी पैरामीटर हटा दें।
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: यह सुझाव किस ज़रूरत को पूरा करता है?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: सुझाया गया सुधार
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: किसे और कैसे लाभ होगा? (वैकल्पिक)
    validations:
      required: false
