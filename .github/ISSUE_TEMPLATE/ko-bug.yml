name: '[ko] 문제 신고'
description: 문제와 재현 방법을 설명해 주세요.
title: '[Bug][ko] '
body:
  - type: markdown
    attributes:
      value: |-
        Issue와 첨부 파일은 공개됩니다. 비밀번호, 토큰, 개인정보 또는 기밀 자료를 포함하지 마세요. 보안 취약점과 비공개 의견은 이메일로 보내 주세요.

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [모든 언어](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: 공개 페이지 또는 문서와 버전
      description: 공개 URL이나 문서 제목, 절, 알고 있는 버전을 적어 주세요. 비공개 식별 정보와 쿼리 매개변수는 제거해 주세요.
    validations:
      required: false
  - type: textarea
    id: observed
    attributes:
      label: 어떤 일이 발생했나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 수행한 작업을 설명해 주세요. 재현할 수 없으면 그 사실을 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 어떤 결과를 기대했나요?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 브라우저, 기기 및 관련 설정 (선택)
      description: '예: 브라우저 버전, 글자 크기, 키보드 또는 관련 보조 기술. 의료 정보나 개인정보는 필요하지 않습니다.'
    validations:
      required: false
