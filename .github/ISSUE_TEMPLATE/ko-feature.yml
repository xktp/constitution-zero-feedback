name: '[ko] 기능 제안'
description: 필요한 점과 개선 방안을 설명해 주세요.
title: '[Feature][ko] '
body:
  - type: markdown
    attributes:
      value: |-
        Issue와 첨부 파일은 공개됩니다. 비밀번호, 토큰, 개인정보 또는 기밀 자료를 포함하지 마세요. 보안 취약점과 비공개 의견은 이메일로 보내 주세요.

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [모든 언어](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: 공개 페이지 또는 문서와 버전
      description: 공개 URL이나 문서 제목, 절, 알고 있는 버전을 적어 주세요. 비공개 식별 정보와 쿼리 매개변수는 제거해 주세요.
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: 어떤 필요를 해결하려는 제안인가요?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 개선 제안
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 누가 어떤 도움을 받나요? (선택)
    validations:
      required: false
