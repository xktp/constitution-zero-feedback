name: '[ja] 機能の提案'
description: 必要性と改善案を説明してください。
title: '[Feature][ja] '
body:
  - type: markdown
    attributes:
      value: |-
        Issue と添付ファイルは公開されます。パスワード、トークン、個人情報、機密情報を記載しないでください。セキュリティ上の脆弱性や非公開の相談はメールでお送りください。

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [すべての言語](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: 公開ページまたは文書とバージョン
      description: 公開 URL、または文書名・節・分かる範囲のバージョンを記載してください。非公開の識別情報やクエリパラメーターは除いてください。
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: どのような必要性に応える提案ですか？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 改善案
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 誰にどのような利点がありますか？（任意）
    validations:
      required: false
