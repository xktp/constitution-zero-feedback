name: '[zh-CN] 内容或引用更正'
description: 更正研究正文、来源或引用。
title: '[Correction][zh-CN] '
body:
  - type: markdown
    attributes:
      value: |-
        Issue 和附件会公开显示。请勿填写密码、令牌、个人信息或保密资料。安全漏洞和私密反馈请改用邮箱。

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [全部语言](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: 公开页面或文档及版本
      description: 请提供公开链接，或文档名称、章节及已知版本。移除私密标识和查询参数。
    validations:
      required: false
  - type: textarea
    id: excerpt
    attributes:
      label: 需要更正的原文或引用
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议更正内容及原因
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 公开来源或补充说明（选填）
    validations:
      required: false
