name: '[pt-BR] Acessibilidade ou tradução'
description: Relate uma barreira de acesso ou um problema de tradução.
title: '[Accessibility/Translation][pt-BR] '
body:
  - type: markdown
    attributes:
      value: |-
        As issues e os anexos são públicos. Não inclua senhas, tokens, dados pessoais ou informações confidenciais. Envie vulnerabilidades de segurança e relatos privados por e-mail.

        [support@constitutionzero.com](mailto:support@constitutionzero.com)

        [Todos os idiomas](https://github.com/xktp/constitution-zero-feedback#languages)
  - type: input
    id: context
    attributes:
      label: Página pública ou documento e versão
      description: Informe uma URL pública ou o título, a seção e a versão do documento, se souber. Remova
        identificadores privados e parâmetros de consulta.
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: Tipo de feedback
      options:
        - Acessibilidade
        - Tradução
        - Ambas
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Barreira ou problema de tradução
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Redação ou comportamento acessível esperado
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Navegador, dispositivo e configurações relevantes (opcional)
      description: 'Por exemplo: versão do navegador, tamanho do texto, teclado ou tecnologia assistiva.
        Não compartilhe dados médicos ou pessoais.'
    validations:
      required: false
